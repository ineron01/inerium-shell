[package]
name = "inerium-tools"
description = "Fast native telemetry daemons, IPC bridges, and system monitors for Waybar & Hyprland"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
msi-ec = []

[[bin]]
name = "inerium-ctl"
path = "src/bin/inerium-ctl.rs"

[[bin]]
name = "msi-fan-regulator"
path = "src/bin/msi-fan-regulator.rs"
required-features = ["msi-ec"]

[dependencies]
inerium-hw = { workspace = true }
inerium-i18n = { workspace = true }
inerium-theme = { workspace = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
