[package]
name = "inerium-tools"
description = "Fast native telemetry daemons, IPC bridges, and system monitors for Waybar & Hyprland"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["msi-ec"]
msi-ec = []

[[bin]]
name = "msi-fan-regulator"
path = "src/bin/msi-fan-regulator.rs"
required-features = ["msi-ec"]

[dependencies]
inerium-hw = { path = "../inerium-hw" }
inerium-i18n = { path = "../inerium-i18n" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
