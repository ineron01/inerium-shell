[package]
name = "dolphin-convert"
description = "Fast multi-format document and media converter CLI with AI background removal"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rayon = "1.10"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-29"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
