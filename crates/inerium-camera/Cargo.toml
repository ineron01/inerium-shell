[package]
name = "inerium-camera"
description = "High-performance virtual webcam manager and streamer (Android ADB/Wi-Fi to v4l2loopback)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
inerium-i18n = { workspace = true }
inerium-theme = { workspace = true }
gtk4 = { workspace = true }
gdk4 = { workspace = true }
glib = { workspace = true }
gstreamer = "0.25"
gstreamer-app = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "net"] }
nix = { version = "0.29", features = ["signal", "process", "user"] }
serde = { workspace = true }
serde_json = { workspace = true }
