[workspace]
resolver = "3"
members = [
    "crates/inerium-i18n",
    "crates/inerium-hw",
    "crates/inerium-tools",
    "crates/inerium-shell",
    "crates/inerium-greeter",
    "crates/inerium-setup",
    "crates/dolphin-converter",
    "crates/inerium-camera",
]
exclude = [
    "standalone/inerium-polkit",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Ineron"]
repository = "https://github.com/ineron01/inerium-shell"
homepage = "https://ineron01.github.io/inerium-shell"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk4 = "0.11"
gio = "0.22"
glib = "0.22"
relm4 = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
