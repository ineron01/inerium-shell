[workspace]
resolver = "3"
members = [
    "crates/inerium-i18n",
    "crates/inerium-hw",
    "crates/inerium-tools",
    "crates/inerium-shell",
    "crates/inerium-greeter",
    "crates/inerium-setup",
    "crates/dolphin-converter",
    "crates/inerium-camera",
    "crates/inerium-polkit",
    "crates/inerium-theme",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
authors = ["Ineron"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ineron01/inerium-shell"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk4 = "0.11"
gio = "0.22"
glib = "0.22"
relm4 = "0.11"
inerium-hw = { path = "crates/inerium-hw", version = "0.2.2" }
inerium-i18n = { path = "crates/inerium-i18n", version = "0.2.2" }
inerium-theme = { path = "crates/inerium-theme", version = "0.2.2" }
inerium-tools = { path = "crates/inerium-tools", version = "0.2.2" }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
