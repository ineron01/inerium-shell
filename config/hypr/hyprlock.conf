# Hyprlock — Inerium Dragon, в стиле Центра управления и попапов
# Размытый снимок экрана + центральная карточка: время, дата, пароль, статус.

# Theme colors generated by inerium-theme (with safe fallbacks)
$LOCK_CARD_COLOR = rgba(24, 22, 22, 0.92)
$LOCK_BORDER_COLOR = rgba(197, 201, 197, 0.10)
$LOCK_CLOCK_COLOR = rgba(230, 226, 204, 1.0)
$LOCK_DATE_COLOR = rgba(196, 178, 138, 1.0)
$LOCK_USER_COLOR = rgba(115, 124, 115, 1.0)
$LOCK_INPUT_BG = rgba(34, 31, 31, 1.0)
$LOCK_INPUT_BORDER = rgba(197, 201, 197, 0.12)
$LOCK_INPUT_FG = rgba(230, 226, 204, 1.0)
$LOCK_CHECK_COLOR = rgba(135, 169, 135, 0.85)
$LOCK_FAIL_COLOR = rgba(196, 116, 110, 0.90)
$LOCK_CAPS_COLOR = rgba(196, 178, 138, 0.90)
$LOCK_SUBTEXT_COLOR = rgba(166, 166, 156, 1.0)
$LOCK_PLACEHOLDER_COLOR = #737c73
$LOCK_FAIL_TEXT_COLOR = #c4746e
$LOCK_CHECK_TEXT_COLOR = #87a987

source = ~/.config/hypr/hyprlock-colors.conf

# Fallback i18n variables (English by default, prevents raw variable names if override is missing)
$LOCK_PLACEHOLDER = <span foreground="$LOCK_PLACEHOLDER_COLOR">Password</span>
$LOCK_FAIL = <span foreground="$LOCK_FAIL_TEXT_COLOR">Wrong password · attempt $ATTEMPTS</span>
$LOCK_CHECK = <span foreground="$LOCK_CHECK_TEXT_COLOR">Verifying…</span>
$LOCK_DATE_CMD = LC_TIME=en_US.UTF-8 date +"%A, %B %-d"

# Optional generated locale override
source = ~/.config/hypr/hyprlock-i18n.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldColors, 1, 3, soft
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
}

# Карточка (как .cc: тёмная, скругление, тонкая рамка, тень)
shape {
    monitor =
    size = 420, 330
    color = $LOCK_CARD_COLOR
    rounding = 22
    border_size = 1
    border_color = $LOCK_BORDER_COLOR
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, 0
    halign = center
    valign = center
}

# Время
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $LOCK_CLOCK_COLOR
    font_size = 64
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 92
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] $LOCK_DATE_CMD
    color = $LOCK_DATE_COLOR
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 32
    halign = center
    valign = center
}

# Пользователь
label {
    monitor =
    text = 󰀄  $USER
    color = $LOCK_USER_COLOR
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 2
    halign = center
    valign = center
}

# Поле пароля (как поле ввода в попапах)
input-field {
    monitor =
    size = 340, 46
    rounding = 12
    outline_thickness = 1
    outer_color = $LOCK_INPUT_BORDER
    inner_color = $LOCK_INPUT_BG
    font_color = $LOCK_INPUT_FG
    font_family = JetBrainsMono Nerd Font
    check_color = $LOCK_CHECK_COLOR
    fail_color = $LOCK_FAIL_COLOR
    capslock_color = $LOCK_CAPS_COLOR
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = $LOCK_PLACEHOLDER
    fail_text = $LOCK_FAIL
    check_text = $LOCK_CHECK
    hide_input = false
    position = 0, -48
    halign = center
    valign = center
}

# Нижняя строка карточки: батарея и раскладка
label {
    monitor =
    text = cmd[update:30000] b=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -n1); [ -n "$b" ] || exit 0; c=$(cat "$b/capacity" 2>/dev/null); s=$(cat "$b/status" 2>/dev/null); [ "$s" = Charging ] && i=󰂄 || i=󰁹; echo "$i $c%"
    color = $LOCK_SUBTEXT_COLOR
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -70, -118
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $LOCK_SUBTEXT_COLOR
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 70, -118
    halign = center
    valign = center
}
