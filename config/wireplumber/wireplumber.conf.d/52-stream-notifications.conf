# WirePlumber rule to assign media.role = Notification for communication clients
# that do not set it explicitly (e.g. Telegram Desktop OpenAL notification audio).
# This ensures that when Do Not Disturb (DND) is active, WirePlumber route-settings
# automatically mutes notification audio streams.

stream.rules = [
  {
    matches = [
      {
        application.name = "Telegram"
      }
      {
        application.name = "Telegram Desktop"
      }
      {
        application.process.binary = "Telegram"
      }
    ]
    actions = {
      update-props = {
        media.role = "Notification"
      }
    }
  }
]
