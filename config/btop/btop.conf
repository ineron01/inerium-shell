# Inerium Desktop — btop layout & theme configuration
# Non-default settings and theme overrides (defaults are applied for omitted keys)

# Theme & Appearance
color_theme = "kanagawa-dragon"
theme_background = true
truecolor = true
rounded_corners = true
graph_symbol = "braille"

# Panels & Refresh
shown_boxes = "proc mem net cpu"
update_ms = 2000

# Process Panel
proc_sorting = "memory"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false

# CPU & Thermal Sensors
cpu_invert_lower = true
show_uptime = true
show_cpu_watts = true
check_temp = true
show_coretemp = true
temp_scale = "celsius"

# Battery & Hardware Telemetry
show_battery = true
selected_battery = "Auto"
show_battery_watts = true
vim_keys = false
save_config_on_exit = true
