name: Bug Report
description: Report an issue or unexpected behavior in Inerium Shell
title: "fix(scope): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you are running the latest version of Inerium Shell before submitting.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open Inerium Control Center via Super+A
        2. Click on ...
        3. Observe crash or error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: System Environment
      description: Kernel, Hardware (GPU/CPU), and OS details
      placeholder: "CachyOS / Arch Linux, Linux 6.13, AMD Ryzen 7 7735HS, RTX 4050"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Output from `journalctl --user -u <service>`, `dmesg`, or CLI errors
      render: shell
