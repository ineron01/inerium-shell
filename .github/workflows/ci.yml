name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf clang binutils \
            gtk4 gtk4-layer-shell vte4 libadwaita \
            pango cairo gdk-pixbuf2 glib2
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Cargo check workspace
        run: cargo check --workspace --all-targets
      - name: Cargo clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test workspace
        run: cargo test --workspace

  syntax-lint:
    name: Shell, Python & Lua Syntax Lint
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install runtime interpreters
        run: pacman -Syu --noconfirm --needed git bash lua python
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Script syntax check
        run: |
          bash -n *.sh
          bash -n scripts/install/*.sh
          for f in local/bin/*; do
            [[ -f "$f" ]] || continue
            if head -n 1 "$f" | grep -qE "bash|sh"; then
              bash -n "$f"
            elif head -n 1 "$f" | grep -q "python"; then
              python3 -m py_compile "$f"
            fi
          done
      - name: Lua syntax check
        run: |
          luac -p config/hypr/*.lua
          luac -p config/hypr/config/*.lua

  installer-dryrun:
    name: Installer Smoke Test
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install runtime utilities
        run: pacman -Syu --noconfirm --needed git bash
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dry-run test (prebuilt mode)
        run: ./install.sh --dry-run
      - name: Dry-run test (from-source mode)
        run: ./install.sh --from-source --dry-run
