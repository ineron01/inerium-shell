name: Build and Release Inerium Binaries

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.2.2)"
        required: true
        default: "v0.2.2"

permissions:
  contents: write

jobs:
  check-abi:
    name: Check Rolling Binaries ABI
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    outputs:
      needs_rebuild: ${{ steps.check.outputs.needs_rebuild }}
    steps:
      - name: Install runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            curl tar \
            gtk4 gtk4-layer-shell vte4 \
            pango cairo gdk-pixbuf2 glib2 \
            gstreamer gst-plugins-base-libs

      - name: Check ABI health
        id: check
        run: |
          ARCHIVE_URL="https://github.com/${{ github.repository }}/releases/download/rolling/inerium-binaries-linux-x86_64.tar.gz"
          mkdir -p /tmp/abi-check
          echo "Fetching $ARCHIVE_URL..."
          HTTP_CODE=$(curl -sSL -w "%{http_code}" -o /tmp/abi-check/archive.tar.gz "$ARCHIVE_URL" || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Rolling release archive not found (HTTP $HTTP_CODE). Rebuild needed."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! tar -xzf /tmp/abi-check/archive.tar.gz -C /tmp/abi-check 2>/dev/null; then
            echo "Failed to extract rolling archive. Rebuild needed."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEEDS_REBUILD=false
          for bin in \
            inerium-ctl inerium-shell inerium-setup dolphin-convert \
            inerium-greeter inerium-camera inerium-polkit msi-fan-regulator; do
            if [ ! -f "/tmp/abi-check/$bin" ]; then
              echo "Binary $bin missing from archive. Rebuild needed."
              NEEDS_REBUILD=true
              break
            fi
            MISSING=$(ldd "/tmp/abi-check/$bin" 2>/dev/null | grep "not found" || true)
            if [ -n "$MISSING" ]; then
              echo "ABI breakage in $bin: $MISSING"
              NEEDS_REBUILD=true
              break
            fi
          done
          echo "needs_rebuild=$NEEDS_REBUILD" >> "$GITHUB_OUTPUT"

  build-arch-x86_64:
    name: Build Arch x86_64 Binaries
    needs: check-abi
    if: ${{ always() && !cancelled() && (github.event_name != 'schedule' || needs.check-abi.outputs.needs_rebuild == 'true') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf clang mold binutils \
            gtk4 gtk4-layer-shell vte4 \
            pango cairo gdk-pixbuf2 glib2 \
            gstreamer gst-plugins-base-libs

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust workspace (release)
        run: |
          cargo build --manifest-path Cargo.toml --workspace --release
          cargo build --manifest-path Cargo.toml -p inerium-tools --features msi-ec --bin msi-fan-regulator --release

      - name: Package and checksum binaries
        run: |
          mkdir -p dist
          for bin in \
            inerium-ctl inerium-shell inerium-setup dolphin-convert \
            inerium-greeter inerium-camera inerium-polkit msi-fan-regulator; do
            install -m 755 "target/release/$bin" "dist/$bin"
          done
          strip --strip-unneeded dist/* || true
          tar -C dist -czf inerium-binaries-linux-x86_64.tar.gz .
          sha256sum inerium-binaries-linux-x86_64.tar.gz > inerium-binaries-linux-x86_64.tar.gz.sha256
          ls -lh inerium-binaries-linux-x86_64.tar.gz inerium-binaries-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'rolling' || (github.event_name == 'push' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.2.{0}', github.run_number))) }}
          name: ${{ github.event_name == 'schedule' && 'Inerium Desktop Rolling' || format('Inerium Desktop {0}', github.event_name == 'push' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.2.{0}', github.run_number))) }}
          prerelease: ${{ github.event_name == 'schedule' || inputs.tag == 'rolling' }}
          make_latest: ${{ (github.event_name == 'schedule' || inputs.tag == 'rolling') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            inerium-binaries-linux-x86_64.tar.gz
            inerium-binaries-linux-x86_64.tar.gz.sha256
