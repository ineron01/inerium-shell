name: Build and Release Inerium Binaries

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-arch-x86_64:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf clang mold binutils \
            gtk4 gtk4-layer-shell vte4 libadwaita \
            pango cairo gdk-pixbuf2 glib2 \
            gstreamer gst-plugins-base-libs

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust workspace (release)
        run: |
          cargo build --manifest-path Cargo.toml --workspace --release
          cargo build --manifest-path Cargo.toml -p inerium-tools --features msi-ec --bin msi-fan-regulator --release

      - name: Package and checksum binaries
        run: |
          mkdir -p dist
          for bin in \
            hypr-ipc-bridge inerium-battery inerium-bluetooth inerium-clipboard \
            inerium-clock inerium-dnd inerium-hotspot inerium-hwmon \
            inerium-layout inerium-network inerium-osd-watcher inerium-popup \
            inerium-updates inerium-shell inerium-setup dolphin-convert \
            inerium-greeter inerium-camera inerium-polkit inerium-wallpaper \
            inerium-theme msi-fan-regulator; do
            install -m 755 "target/release/$bin" "dist/$bin"
          done
          strip --strip-unneeded dist/* || true
          tar -C dist -czf inerium-binaries-linux-x86_64.tar.gz .
          sha256sum inerium-binaries-linux-x86_64.tar.gz > inerium-binaries-linux-x86_64.tar.gz.sha256
          ls -lh inerium-binaries-linux-x86_64.tar.gz inerium-binaries-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.2.{0}', github.run_number)) }}
          name: Inerium Desktop ${{ github.event_name == 'push' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.2.{0}', github.run_number)) }}
          generate_release_notes: true
          files: |
            inerium-binaries-linux-x86_64.tar.gz
            inerium-binaries-linux-x86_64.tar.gz.sha256
