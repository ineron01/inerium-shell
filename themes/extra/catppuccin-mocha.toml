[theme]
id = "catppuccin-mocha"
name = "Catppuccin Mocha"
author = "Catppuccin Org"
upstream = "https://github.com/catppuccin/catppuccin"
variant = "dark"
license = "MIT"
description = "Soothing dark pastel theme with warm chocolate sumi tones"

[palette]
bg_canvas         = "rgba(30, 30, 46, 0.97)"
bg_surface        = "#24273a"
bg_surface_alt    = "#181825"
bg_surface_hover  = "#313244"
bg_surface_active = "#45475a"

border_subtle     = "rgba(205, 214, 244, 0.12)"
border_active     = "rgba(137, 180, 250, 0.38)"

text_primary      = "#cdd6f4"
text_heading      = "#cdd6f4"
text_muted        = "#6c7086"
text_subtle       = "#a6adc8"
text_inverted     = "#11111b"

accent_green      = "#a6e3a1"
accent_green_bg   = "rgba(166, 227, 161, 0.16)"
accent_green_border = "rgba(166, 227, 161, 0.38)"

accent_blue       = "#89b4fa"
accent_blue_bg    = "rgba(137, 180, 250, 0.16)"
accent_blue_border = "rgba(137, 180, 250, 0.38)"

accent_amber      = "#fab387"
accent_amber_bg   = "rgba(250, 179, 135, 0.16)"
accent_amber_border = "rgba(250, 179, 135, 0.38)"

accent_red        = "#f38ba8"
accent_red_bg     = "rgba(243, 139, 168, 0.16)"
accent_red_border = "rgba(243, 139, 168, 0.38)"

accent_aqua       = "#94e2d5"
accent_aqua_bg    = "rgba(148, 226, 213, 0.16)"
accent_aqua_border = "rgba(148, 226, 213, 0.38)"

accent_purple     = "#cba6f7"
accent_purple_bg  = "rgba(203, 166, 247, 0.16)"
accent_purple_border = "rgba(203, 166, 247, 0.38)"

shadow            = "rgba(0, 0, 0, 0.85)"
modal_backdrop    = "rgba(17, 17, 27, 0.60)"
slider_trough     = "rgba(108, 112, 134, 0.22)"
slider_thumb      = "#cdd6f4"

[display]
temperature = 6500
