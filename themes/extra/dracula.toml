[theme]
id = "dracula"
name = "Dracula"
author = "Zeno Rocha"
upstream = "https://github.com/dracula/dracula-theme"
variant = "dark"
license = "MIT"
description = "A dark gothic theme with vibrant high-contrast neon accents"

[typography]
font_ui = "Inter"
font_mono = "JetBrainsMono Nerd Font"
font_size = 10.0

[palette]
bg_canvas         = "rgba(40, 42, 54, 0.98)"
bg_surface        = "#343746"
bg_surface_alt    = "#21222c"
bg_surface_hover  = "#3f4356"
bg_surface_active = "#44475a"

border_subtle     = "rgba(98, 114, 164, 0.28)"
border_active     = "#bd93f9"
border_active_secondary = "#ff79c6"

text_primary      = "#f8f8f2"
text_heading      = "#f8f8f2"
text_muted        = "#6272a4"
text_subtle       = "#6272a4"
text_inverted     = "#282a36"

slider_fill       = "#bd93f9"
slider_fill_secondary = "#ffb86c"

accent_primary    = "#bd93f9"
accent_orange     = "#ffb86c"

accent_green      = "#50fa7b"
accent_green_bg   = "rgba(80, 250, 123, 0.20)"
accent_green_border = "rgba(80, 250, 123, 0.45)"

accent_blue       = "#bd93f9"
accent_blue_bg    = "rgba(189, 147, 249, 0.20)"
accent_blue_border = "rgba(189, 147, 249, 0.45)"

accent_amber      = "#f1fa8c"
accent_amber_bg   = "rgba(241, 250, 140, 0.20)"
accent_amber_border = "rgba(241, 250, 140, 0.45)"

accent_red        = "#ff5555"
accent_red_bg     = "rgba(255, 85, 85, 0.20)"
accent_red_border = "rgba(255, 85, 85, 0.45)"

accent_aqua       = "#8be9fd"
accent_aqua_bg    = "rgba(139, 233, 253, 0.20)"
accent_aqua_border = "rgba(139, 233, 253, 0.45)"

accent_purple     = "#ff79c6"
accent_purple_bg  = "rgba(255, 121, 198, 0.20)"
accent_purple_border = "rgba(255, 121, 198, 0.45)"

shadow            = "rgba(0, 0, 0, 0.85)"
modal_backdrop    = "rgba(33, 34, 44, 0.65)"
slider_trough     = "rgba(98, 114, 164, 0.25)"
slider_thumb      = "#f8f8f2"

[display]
temperature = 6500
