[theme]
id = "nord"
name = "Nord"
author = "Arctic Ice Studio"
upstream = "https://github.com/nordtheme/nord"
variant = "dark"
license = "MIT"
description = "An arctic, north-bluish clean and elegant color palette"

[typography]
font_ui = "Inter"
font_mono = "JetBrainsMono Nerd Font"
font_size = 11.0

[palette]
bg_canvas         = "rgba(46, 52, 64, 0.98)"
bg_surface        = "#3b4252"
bg_surface_alt    = "#242933"
bg_surface_hover  = "#434c5e"
bg_surface_active = "#4c566a"

border_subtle     = "rgba(76, 86, 106, 0.40)"
border_active     = "#88c0d0"
border_active_secondary = "#81a1c1"

text_primary      = "#eceff4"
text_heading      = "#eceff4"
text_muted        = "#7b88a1"
text_subtle       = "#d8dee9"
text_inverted     = "#2e3440"

slider_fill       = "#88c0d0"
slider_fill_secondary = "#ebcb8b"

accent_primary    = "#88c0d0"
accent_orange     = "#d08770"

accent_green      = "#a3be8c"
accent_green_bg   = "rgba(163, 190, 140, 0.18)"
accent_green_border = "rgba(163, 190, 140, 0.42)"

accent_blue       = "#81a1c1"
accent_blue_bg    = "rgba(129, 161, 193, 0.18)"
accent_blue_border = "rgba(129, 161, 193, 0.42)"

accent_amber      = "#ebcb8b"
accent_amber_bg   = "rgba(235, 203, 139, 0.18)"
accent_amber_border = "rgba(235, 203, 139, 0.42)"

accent_red        = "#bf616a"
accent_red_bg     = "rgba(191, 97, 106, 0.18)"
accent_red_border = "rgba(191, 97, 106, 0.42)"

accent_aqua       = "#88c0d0"
accent_aqua_bg    = "rgba(136, 192, 208, 0.18)"
accent_aqua_border = "rgba(136, 192, 208, 0.42)"

accent_purple     = "#b48ead"
accent_purple_bg  = "rgba(180, 142, 173, 0.18)"
accent_purple_border = "rgba(180, 142, 173, 0.42)"

shadow            = "rgba(0, 0, 0, 0.85)"
modal_backdrop    = "rgba(36, 41, 51, 0.65)"
slider_trough     = "rgba(76, 86, 106, 0.25)"
slider_thumb      = "#eceff4"

[display]
temperature = 6500
